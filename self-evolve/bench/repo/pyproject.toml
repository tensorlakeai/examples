[project]
name = "leetlib"
version = "0.1.0"
description = "Five LeetCode-Hard stubs with real bugs. Bench for self-evolving agent."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["leetlib*"]
